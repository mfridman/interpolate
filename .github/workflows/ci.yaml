name: Project CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test:
    name: Run tests (Go ${{ matrix.go-version }})
    timeout-minutes: 5
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The oldest version is the minimum version in go.mod.
        go-version: ["1.19", "oldstable", "stable"]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Install Go
        uses: actions/setup-go@v5
        with:
          check-latest: true
          go-version: ${{ matrix.go-version }}
      - name: Check Go code formatting
        run: |
          if [ "$(gofmt -s -l . | wc -l)" -gt 0 ]; then
            gofmt -s -l .
            echo "Please format Go code by running: go fmt ./..."
            exit 1
          fi
      - name: Run go vet
        run: go vet ./...
      - name: Run tests
        run: go test ./... -count=1 -race -v
